  description: 'Complete original generic selection rule refuted: a nonempty open family of real 3×3 data matrices
    has invertibility, distinct squared singular values, a finite full stationary set, a unique least-absolute-multiplier
    pair and a strictly closer feasible matrix in the actual Frobenius norm.'
