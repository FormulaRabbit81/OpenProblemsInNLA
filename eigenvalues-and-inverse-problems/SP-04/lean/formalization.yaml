  scope: 'Complete original generic rule refuted: every ordered scalar triple in the source box, all actual admissible
    SVDs and a nonempty open family in all nine real matrix entries are covered. Every nonzero polynomial exception
    is defeated by an invertible simple-spectrum example with a finite full stationary set, unique least-absolute
    multiplier pair and strict actual Frobenius improvement. All eleven reviewed declarations passed fresh sandboxed
    Linux Comparator and default-kernel replay in run 35025876241, attempt 1. Both independent source and operational
    reviews approved; canonical status is Lean verified. Challenge contains eleven deliberate specification-only
    placeholders, excluded from proof-development sorry counts.'
