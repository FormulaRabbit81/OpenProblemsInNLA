version: v0.4
project:
  name: 'SP-04: generic failure of the smallest-absolute-multiplier rule'
  description: 'Complete original generic selection rule refuted: a nonempty open family of real 3×3 data matrices
    has invertibility, distinct squared singular values, a finite full stationary set, a unique least-absolute-multiplier
    pair and a strictly closer feasible matrix in the actual Frobenius norm.'
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: Complete locally compiled candidate. Independent final source reviews, actual Comparator and authoritative
    isolated Linux verification are pending; canonical status remains Solved.
