  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8f04b905eb2e0827b6b84f37d9d080ae1f05b202/eigenvalues-and-inverse-problems/SP-04/solution.md
  type: manuscript
  relationship: formalizes
  location: 'Theorem SP-04, sections1–4: every ordered real singular-value triple in (7/4,44/25), complete stationary
    reduction, unique least multiplier, strict sign-flip improvement and algebraic-generic failure.'
  author_endorsement: not-contacted
  note: Original mathematical authorship remains Matthew J. Colbrook, Department of Applied Mathematics and Theoretical
    Physics, University of Cambridge. The complete source is preserved. The formal proof adds explicit full stationary-set
    finiteness and constructs a polynomial-sign open subset through actual Gram eigenvalues/SVD. Illustrative
    decimal values and unnecessary asymptotic observations are not claimed as additional results. Formalization
    credit is supplied as requested by the campaign user; no separate author endorsement or external human review
    is asserted.
