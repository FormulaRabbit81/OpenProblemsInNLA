    prompting_notes: Preserve all dimensions, all real positive-definite inputs, actual column vectorization/Kronecker
      coefficients, the full complex Hermitian PSD cone, realness of the modulus, exact Frobenius squared norms
      and attained minima over both full sectors. Minimize computation using symbolic Sylvester congruences, spectral
      PSD slack, reciprocal eigenvalue bounds and coordinate-box compactness. The kernel certificate 0<2 is consumed
      through the arbitrary-dimension skew witness norm.
