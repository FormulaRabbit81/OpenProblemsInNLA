  note: Complete source and authoritative Linux evidence approved by both independent referees. Verified proof
    revision 9c8369dcea69f9f243a0502fb7e89beaa8f49fad.
sources:
- title: SP-05 — Symmetric minimizer for a positive definite Jordan–Kronecker product
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/d8c38a795876b132c90df8d1be8682d3dcde394c/eigenvalues-and-inverse-problems/SP-05/README.md
  type: web-post
  relationship: formalizes
  location: 'Complete original problem statement: all n≥2, all real symmetric positive-definite A,B, column vectorization,
    the actual commutation permutation matrix and both attained full-sector Rayleigh minima.'
  author_endorsement: not-contacted
  note: Permanent ID, canonical path and complete original target are unchanged. The original conjecture remains
    credited to N. Kalantarova and L. Tunçel.
- title: 'SP-05: A positive-semidefinite minimizing eigenmatrix'
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/d8c38a795876b132c90df8d1be8682d3dcde394c/eigenvalues-and-inverse-problems/SP-05/solution.md
  type: manuscript
  relationship: formalizes
  location: 'Theorem SP-05 and sections 1–3: complex inverse-cone positivity, a real PSD minimizing eigenmatrix,
    and the exact symmetric/skew quotient inequality.'
  author_endorsement: not-contacted
  note: Original mathematical authorship remains Matthew J. Colbrook, Department of Applied Mathematics and Theoretical
    Physics, University of Cambridge. The full source and historical attribution are preserved. The formal proof
    replaces the exponential-integral argument by a Hermitian negative-eigenvector Sylvester contradiction, and
    proves both modulus cross terms nonnegative separately. Neither simplification changes the target or adds
    assumptions. Formalization credit is supplied as requested by the campaign user; no separate author endorsement
    or external human review is asserted.
- title: On the spectral structure of Jordan–Kronecker products of symmetric and skew-symmetric matrices
  authors:
  - N. Kalantarova
  - L. Tunçel
  id: https://arxiv.org/abs/1805.09737v3
  type: paper
  relationship: background
  location: Conjecture 1, equation (7), page 12 of arXiv v3; original positive-definite symmetric-minimizer question.
  author_endorsement: not-contacted
