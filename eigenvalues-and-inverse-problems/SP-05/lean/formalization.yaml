project:
  name: 'SP-05: a PSD minimizer for the positive definite Jordan–Kronecker product'
  description: The complete original symmetric/skew Rayleigh-minimum inequality for every real symmetric positive-definite
    pair and every n≥2, with actual attained sector minima. The stronger source result gives a real nonzero PSD
    eigenmatrix at the global Jordan minimum for every n≥1.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: Complete locally checked proof candidate. Final independent source reviews, actual isolated Linux Comparator/default-kernel
    execution and operational approvals are pending. Canonical status remains Solved.
sources:
- title: SP-05 — Symmetric minimizer for a positive definite Jordan–Kronecker product
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/d8c38a795876b132c90df8d1be8682d3dcde394c/eigenvalues-and-inverse-problems/SP-05/README.md
  type: web-post
  relationship: formalizes
