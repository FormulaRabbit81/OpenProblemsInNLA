version: v0.4
project:
  name: 'IE-13: sharp GEPP growth for unequal lower and upper bandwidths'
  description: Complete Lean formalization of sharp GEPP growth for every original unequal bandwidth pair,
    complex nonsingular input, admissible dimension and legal maximal-modulus pivot path, with exact rational
    attainment and actual real supremum. Canonical Linux run 35081003513 accepted literal proof commit
    032d4c86c52ffde0c4d440f28527ba43555a0a24.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
