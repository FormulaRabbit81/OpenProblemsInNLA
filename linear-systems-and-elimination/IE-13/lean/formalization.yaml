  type: web-post
  location: 'Complete original problem: every unequal bandwidth pair, complex field, all dimensions and
    all admissible ties'
  relationship: formalizes
  author_endorsement: not-contacted
  note: Permanent ID, original-order band condition, all active entries and dimension-union supremum are
    retained.
