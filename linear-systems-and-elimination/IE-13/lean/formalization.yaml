fidelity:
  divergences: Zero-based Fin indices and zero-padded inactive Schur blocks replace one-based active matrices.
    A structurally recursive history register implements the integer recurrence, with exported correspondence.
    Actual arbitrary input scale is retained. Finite-subset envelope bounds replace sorting without weakening
    the domain. An explicitly proved prefix-extension lemma can complete the witness after its attaining
    entry is visible. The source matrix is defined first over rational numbers and then embedded into
    complex numbers; no preliminary algorithmic permutation is introduced.
review:
  status: Two independent complete mathematical-source review chains and final actual canonical runtime
    continuations accepted.
  reviewers:
  - OpenAI Codex /root/mf22_publication_referee
  - OpenAI Codex /root/mi04_independent_referee
  notes: The two final reports under reviews/final independently authenticate all 95 original inputs and
    actual complete logs for run35081003513. Historical private inventories are labelled and not presented
    as fully copied archives. These are independent audits of one real Linux execution, not separately
    executed second and third Lean runs. The matrix-functions referee subsequently prepared publication
    metadata only; root performs independent publication review and later exact-head/upstream gates.
