  type: manuscript
  location: Theorem 1 and complete Sections 2–4, including exact attaining construction
  relationship: formalizes
  author_endorsement: not-contacted
  note: Original mathematics credited to Matthew J. Colbrook, Department of Applied Mathematics and Theoretical
    Physics, University of Cambridge. Optional source closed forms are not necessary for the full original
    recurrence answer.
