automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple independent problem agents; source drafting on macOS, all actual Lean and Comparator
      execution assigned to non-root Linux. No local Lean/Lake or cache downloads.
    prompting_notes: Write full numerical statements first, then literal definitions and independent contracts.
      Preserve all bandwidth endpoints, complex entries, every pivot tie, every active stage, actual nonsingularity
      and rational attainment. Use exact recurrence and finite-subset bounds in place of sorting or growing
      interval boxes. Require two independent statement approvals and actual elaboration before freezing
      and proofs.
  notes: AI-assisted implementation with two independent complete mathematical source and actual-runtime
    review chains. Actual non-root Linux canonical run 35081003513 accepted all 28 exports at literal
    proof commit 032d4c86c52ffde0c4d440f28527ba43555a0a24. Publication-head and upstream merge runs are
    separate pending gates. No human peer review, official Tau Ceti endorsement or checker/platform infallibility
    claim.
status:
  scope: Exact sharp GEPP growth for every natural lower/upper bandwidth pair, every allowed positive
    finite dimension, nonsingular complex matrices and all legal maximal-modulus pivot choices. Includes
    p=0, q=0, general original-label front, all active entries, literal rational witnesses with genuine
    prefix extension, attained greatest value and real supremum.
  whole_problem_verified: true
