fidelity:
  divergences: Zero-based Fin indices and zero-padded inactive Schur blocks replace one-based active matrices.
    A structurally recursive history register implements the integer recurrence, with exported correspondence.
    Actual arbitrary input scale is retained. Finite-subset envelope bounds replace sorting without weakening
    the domain. An explicitly proved prefix-extension lemma can complete the witness after its attaining
    entry is visible. The source matrix is defined first over rational numbers and then embedded into
    complex numbers; no preliminary algorithmic permutation is introduced.
