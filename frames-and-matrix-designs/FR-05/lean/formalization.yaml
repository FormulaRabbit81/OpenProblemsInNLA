verification_plan:
  permitted_axioms:
  - propext
  - Classical.choice
  - Quot.sound
  definition_names: []
  note: >-
    The exact signatures are duplicated in Challenge solely for future
    Comparator checking. Challenge contains three isolated deliberate
    placeholders and is not imported by Solution. A fresh non-root Linux
    Comparator run, statement review, source-to-definition audit, and proof
    review remain outstanding.
fidelity:
  divergences: >-
    The source's target is a probability estimate p_d <= C/d. This project
    exports a deterministic witness, the exact planted coordinate law and one
    radial tail bound, and conditional algebraic reductions. Its Proposition
    3.2 result assumes the two second-moment estimates rather than deriving
    them from the source likelihoods, cone kernels, or overlap law. The
    planted branch does not yet establish the source small-ball and
    least-singular-value estimates or their contraction event, so the export
    remains a checkpoint rather than the manuscript's theorem.
review:
  status: unchecked
  notes: >-
    No independent statement or proof review has been requested or completed.
