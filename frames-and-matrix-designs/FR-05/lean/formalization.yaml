version: v0.4
project:
  name: 'FR-05: deterministic rank-two seed for phase-retrieval noninjectivity'
  description: >-
    A checked partial checkpoint for the phase-retrieval construction:
    exact all-signal measurement semantics, an explicit noninjective frame,
    the source's iid planted law and a radial tail bound, and conditional
    algebraic reductions at the ends of Proposition 3.2 and Theorem 1.4.
    It does not formalize the source's full probabilistic O(d^-1) theorem.
  authors:
  - OpenAI Codex AI
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: 'FR-05: probability of phase-retrieval injectivity'
  id: ../README.md
  type: web-post
  location: Canonical problem statement
  relationship: formalizes
  author_endorsement: n/a
  note: >-
    The permanent problem number, canonical target, source credit, and
    solution-claimed catalog status are unchanged. This project certifies an
    explicit deterministic witness and conditional algebraic reductions, not
    the claimed resolution.
- title: "Resolution of Vinzant's Conjecture on Phase Retrieval Injectivity"
  authors:
  - Zhangsong Li
  id: https://zhangsong-li.github.io/injectivity_phase_retrieval.pdf
  type: manuscript
  location: Sections 2--3, especially the diagonal seed Q_0, Lemma 2.1, and the final comparison
  relationship: adapts
  author_endorsement: not-contacted
  note: >-
    Retrieved and hash-frozen as sources/injectivity_phase_retrieval.pdf.
    The full small-ball, least-singular-value, derivative-control, and
    probability assembly estimates remain outside the checked export.
automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: >-
      Lean 4.33.1 and Mathlib 0df444a360eaa60ab8c11dca51a86af692955474.
      The current files were type-checked on arm64 macOS using an existing
      matching dependency cache; no isolated Comparator verification was run.
    prompting_notes: >-
      Preserve the original all-pairs entrywise-modulus predicate and state
      only completed results as exports. Do not add axioms or represent
      analytic source steps by placeholders in Solution.
  notes: >-
    Implemented at the user's request. No human author endorsement, external
    review, priority claim, measured cost, or full theorem verification is
    inferred from this checkpoint.
status:
  scope: >-
    Incomplete checkpoint, locally type-checked on arm64 macOS. The exports
    supply a simple explicit noninjective 4d-5 row frame, an exact source
    planted-frame law representation, a radial tail estimate, a real-Gaussian
    representation of a complex frame law, and conditional final reductions
    for Proposition 3.2 and Theorem 1.4. They do not prove the full Lemma 3.6
    small-ball estimate, Lemma 3.7, the source good-event probability,
    injectivity-event measurability, source likelihoods, Haar/Stiefel
    estimates, or p_d <= C/d without the analytic comparison hypotheses.
