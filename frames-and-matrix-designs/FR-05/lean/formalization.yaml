# yaml-language-server: $schema=../../../docs/lean/schema/v0.4.schema.json
version: v0.4
project:
  name: 'FR-05: deterministic rank-two seed for phase-retrieval noninjectivity'
  description: >-
    A checked deterministic checkpoint for the phase-retrieval construction:
    exact all-signal measurement semantics, an explicit noninjective frame,
    a scaled Gaussian-frame interface, and the source's final conditional
    inverse-bound reduction. It does not formalize the source's probabilistic
    O(d^-1) theorem.
  authors:
  - OpenAI Codex AI
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: 'FR-05: probability of phase-retrieval injectivity'
  id: ../README.md
  type: web-post
  location: Canonical problem statement
  relationship: formalizes
  author_endorsement: n/a
  note: >-
    The permanent problem number, canonical target, source credit, and
    solution-claimed catalog status are unchanged. This project certifies only
    a deterministic lemma, not the claimed resolution.
- title: "Resolution of Vinzant's Conjecture on Phase Retrieval Injectivity"
  authors:
  - Zhangsong Li
  id: https://zhangsong-li.github.io/injectivity_phase_retrieval.pdf
  type: manuscript
  location: Sections 2--3, especially the diagonal seed Q_0, Lemma 2.1, and the final comparison
  relationship: adapts
  author_endorsement: not-contacted
  note: >-
    Retrieved and hash-frozen as sources/injectivity_phase_retrieval.pdf.
    The local-chart and probability estimates are outside the checked export.
automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: >-
      Lean 4.33.1 and Mathlib 0df444a360eaa60ab8c11dca51a86af692955474.
      The current files were type-checked on arm64 macOS using an existing
      matching dependency cache; no isolated Comparator verification was run.
    prompting_notes: >-
      Preserve the original all-pairs entrywise-modulus predicate and state
      only completed deterministic results as exports. Do not add axioms or
      represent analytic source steps by placeholders in Solution.
  notes: >-
    Implemented at the user's request. No human author endorsement, external
    review, priority claim, measured cost, or full theorem verification is
    inferred from this checkpoint.
status:
  scope: >-
    Incomplete deterministic checkpoint, locally type-checked on arm64 macOS.
    The exported result supplies a simple explicit noninjective 4d-5 row
    frame, a real-Gaussian representation of a complex frame law, and a
    conditional final reduction. It neither proves injectivity-event
    measurability, an open neighbourhood of noninjectivity, Haar/Stiefel
    estimates, nor p_d <= C/d without the analytic comparison hypothesis.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: NLA.FR05.explicit_noninjective_frame
    file: Solution.lean
    sorry_count: 0
    axioms: [propext, Classical.choice, Quot.sound]
    comparator_config: comparator.json
    literature_dependencies: []
verification_plan:
  permitted_axioms:
  - propext
  - Classical.choice
  - Quot.sound
  definition_names: []
  note: >-
    The exact signatures are duplicated in Challenge solely for future
    Comparator checking. Challenge contains two isolated deliberate
    placeholders and is not imported by Solution. A fresh non-root Linux
    Comparator run, statement review, source-to-definition audit, and proof
    review remain outstanding.
fidelity:
  divergences: >-
    The source's target is a probability estimate p_d <= C/d. This project
    exports a deterministic witness, a related Q_0 identity, and a conditional
    final reduction, but not the analytic comparison which would discharge
    that condition. The all-ones frame is not the source's random or locally
    regular frame, so the export remains a checkpoint rather than the
    manuscript's theorem or its finite-dimensional kernel criterion.
review:
  status: unchecked
  notes: >-
    No independent statement or proof review has been requested or completed.
alignment:
  source_freeze: SOURCE_FREEZE.md
  source_map: ../formalisation-plan.md
  checked_definitions:
  - NLA.FR05.PhaseRetrievalInjective
  - NLA.FR05.qZero
  - NLA.FR05.standardComplexGaussianFrame
  - NLA.FR05.phaseRetrievalProbability
  checked_results:
  - NLA.FR05.qZero_isHermitian
  - NLA.FR05.quadraticForm_qZero_allOnes
  - NLA.FR05.explicit_noninjective_frame
  - NLA.FR05.inverse_bound_of_source_comparison
  - NLA.FR05.phaseRetrieval_injective_probability_le_inv_of_source_comparison
acknowledgements: >-
  The Lean and Mathlib contributors provide the proof assistant and library.
  Zhangsong Li is credited as the manuscript author, separately from this
  implementation; no authorship or endorsement is implied.
