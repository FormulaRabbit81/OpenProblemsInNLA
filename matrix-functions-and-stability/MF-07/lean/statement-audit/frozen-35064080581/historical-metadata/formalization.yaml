fidelity:
  divergences: Chronological products use reversed lists and final Fin n sequences. JSR uses the actual
    infimum of positive-length nth-root suprema, with mandatory equivalence to the original radius-one
    limit. A larger rational dimension-only constant replaces the manuscript constant using the separately
    required exp(1) ≤ 3 certificate; the original target only asks for some positive dimension-only
    constant.
