  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Parallel source and referee agents with one coordinator-run serial macOS compiler and
      pinned shared caches. Fresh non-root Linux default-kernel/Comparator/control checking is a separate
      pending gate.
    prompting_notes: Numerical statement boundary written before Lean code. Preserve full original quantifiers,
      true Euclidean norm/root-limit semantics and arbitrary compact complex families. Minimize numerical
      work to one consumed kernel-mode LeanCert exp(1) bound; all dimension and product arguments symbolic.
  notes: Substantial OpenAI Codex assistance. The implementation author prepared this package and is not
    a final independent referee. Historical scoped source/repair reviews and actual successful local command
    origins are retained. Two current final nonauthor reviews and canonical checks remain pending; no
    human or official Tau Ceti approval is claimed.
status:
  scope: For each positive natural dimension d, a positive constant chosen before every nonempty compact
    complex matrix family of joint spectral radius one bounds the actual Euclidean operator norm of every
    length-n product, for every n>=1, by Theta_d*(L*n)^(d-1), where L is the actual maximum generator
    operator norm. Arbitrary infinite compact families, reducibility, repetitions, scalar dimension one,
    and all complex entries remain. Radius-one equivalence between the actual positive-length-root infimum
    and the original nth-root limit is a mandatory separate contract.
