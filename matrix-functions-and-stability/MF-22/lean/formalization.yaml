fidelity:
  divergences: The original question requires some nonnegative polynomial exponent. The implemented final theorem
    selects exponent 2, using uniform eventual inverse-entry bounds and dimension-times-entry bounds for both
    genuine operator norms. This retains the full original target while avoiding the sharper exponent-one estimate
    in the informal manuscript. Exact fixed-size transfer determinants/cofactors and Lagrange projector algebra
    replace generating-function inferences; the actual finite Toeplitz boundaries, all positive parameters,
    exceptional rho squared equal to 10 and eventual nonsingularity remain unchanged.
review:
  status: accepted by two independent nonimplementing AI-agent final mathematical and actual-runtime referees
  reviewers:
  - OpenAI Codex agent /root (independent nonimplementing mathematical source referee)
  - OpenAI Codex agent /root/next_inequalities (independent nonimplementing mathematical source referee)
  - OpenAI Codex agent /root/mf22_publication_referee (independent complete mathematical source and actual-runtime
    referee; subsequent metadata/evidence preparation only)
  notes: Both reviewers read the complete 29-file candidate, original target/manuscript and all 22 frozen contracts.
    Both separately approved the exact proof repairs after failed development runs 35044592511 and 35046126916.
    Report hashes are retained in PUBLICATION-EVIDENCE.json. Later changes require specific reconciliation.
    Their source approvals are not human peer review, official Tau Ceti endorsement, Lean acceptance or Comparator
    acceptance. Exact subsequent repairs after runs 35048156414 and 35050121652 are separately reconciled in
    the retained source-review addenda; earlier reports and failed runs remain unchanged. Final reports under
    reviews/final accepted all 29 implementation files and all 22 original frozen targets, and independently
    reconciled actual run 35053254275 with all 634 exact candidate input blobs. Both referees read the entire
    Comparator log and required control evidence. This is independent auditing of the authenticated run, not
    an independently executed second Lean run or proof of platform/checker infallibility.
