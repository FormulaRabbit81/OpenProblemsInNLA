version: v0.4
project:
  name: 'MF-22: eventual polynomial conditioning of the cubic C1 Toeplitz family'
  description: Complete formally checked proof of the full original MF-22 eventual polynomial-conditioning
    target, with sufficient exponent 2 and every fixed positive real parameter. All 22 targets passed canonical
    non-root Linux run 35053254275 at proof commit c701bfeea660473fc31ad9d0c74b76309be3b49f.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
  note: The immutable proof commit passed canonical verification and two independent final mathematical/runtime
    reviews. Later publication and merge revisions require separate exact-commit execution.
sources:
- title: MF-22 — Polynomial conditioning of the cubic C1 spline Schrodinger Toeplitz family
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8f04b905eb2e0827b6b84f37d9d080ae1f05b202/matrix-functions-and-stability/MF-22/README.md
  type: web-post
  location: Complete original problem, exact coefficient blocks and retained resolution
  relationship: formalizes
  author_endorsement: not-contacted
  note: Permanent ID, original parameter domain, original Toeplitz boundary and complete existential polynomial
    target preserved.
- title: 'MF-22: An eventual linear condition-number bound'
  authors:
  - George Stepaniants
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8f04b905eb2e0827b6b84f37d9d080ae1f05b202/matrix-functions-and-stability/MF-22/solution.md
  type: manuscript
  location: Theorem in Section 1 and complete proof in Sections 2–4
  relationship: adapts
  author_endorsement: not-contacted
  note: The retained manuscript proves a linear bound. This implementation follows its transfer, root, noncancellation
    and finite Green mechanisms but uses a quadratic estimate, which proves the full original existential polynomial
    target. It makes no claim to formalize the manuscript’s exponent-one bound.
- title: Condition numbers of block Toeplitz matrices and stability of space-time IgA approximations for the
    wave and Schrodinger equations
  authors:
  - M. Bogoya
  - A. Bottcher
  - M. Ferrari
  - S. M. Grudsky
  - S. Serra-Capizzano
  id: https://arxiv.org/abs/2608.24151v1
  type: preprint
  location: Equation (5.22), Section 5.3, equation (5.32), Proposition 5.14 and paragraph after Figure 9
  relationship: background
  author_endorsement: not-contacted
  note: The original family, source root classification and question retain their original authors' credit;
    no unproved source result is an intended axiom.
related_formalizations:
- id: https://github.com/sgstepaniants/Forsythe/tree/8d1b0c0545a77b40245e84705aa7d273e6c81e62/lean-proof
  relationship: other
  note: Numerical-target separation, kernel-only LeanCert and Comparator reproduction patterns studied; no
    theorem imported.
- id: https://github.com/jaumededios/Schiffer/tree/2938e277969c329caf154e48a3d8823f3635c7f1
  relationship: other
  note: Independent Challenge/Solution organization studied; no mathematical theorem imported.
- id: https://github.com/leanprover-community/mathlib4/tree/0df444a360eaa60ab8c11dca51a86af692955474
  relationship: builds-on
  note: Actual Euclidean matrix operators and inverses, exact cubic discriminants, Lagrange interpolation,
    Cayley–Hamilton and eigenspace dimension provide proved mathematical foundations.
automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple implementing agents and two independent nonimplementing mathematical referees. Authoring
      occurs on macOS; actual Lean and Comparator gates run on non-root Linux. No local Lean/Lake/cache execution
      is used. The actual canonical run checked all 22 targets with Comparator, default-kernel replay and the
      required per-project controls.
    prompting_notes: Full numerical statements, two independent statement approvals, actual Linux elaboration
      and an immutable freeze preceded proofs. Preserve every positive parameter including rho squared equals
      10, the exact eight coefficient blocks and boundaries, singular condition numbers and actual eventual
      inverses. Use exact fixed-size algebra, cancellation before norm estimates and the permitted exponent
      2. Select LeanCert kernel trust and independent Comparator with no definition holes.
  notes: Complete AI-assisted candidate source was prepared by /root/next_matrix_functions with separately
    assigned root/projector algebra contributions from /root/next_elimination. Independent final mathematical
    source referees are /root and /root/next_inequalities. Prior failed development runs remain failed; source
    approval and successful prefixes do not constitute complete Lean verification. A further independent complete-source
    review was performed by /root/mf22_publication_referee. Final actual canonical-evidence audits by /root
    and /root/mf22_publication_referee accepted run 35053254275. The latter then prepared publication metadata
    and evidence without changing mathematical or checker sources.
