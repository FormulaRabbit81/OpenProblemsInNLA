fidelity:
  divergences: The original question requires some nonnegative polynomial exponent. The implemented
    final theorem selects exponent 2, using uniform eventual inverse-entry bounds and dimension-times-entry
    bounds for both genuine operator norms. This retains the full original target while avoiding
    the sharper exponent-one estimate in the informal manuscript. Exact fixed-size transfer determinants/cofactors
    and Lagrange projector algebra replace generating-function inferences; the actual finite Toeplitz
    boundaries, all positive parameters, exceptional rho squared equal to 10 and eventual nonsingularity
    remain unchanged.
