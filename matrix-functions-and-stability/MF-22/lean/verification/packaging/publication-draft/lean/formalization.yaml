  description: Complete candidate implementation of the original MF-22 existential polynomial-conditioning
    target for every fixed positive real parameter, including eventual nonsingularity and a sufficient
    quadratic bound on the genuine complex Euclidean condition number. Full proof and canonical
    verification remain pending.
