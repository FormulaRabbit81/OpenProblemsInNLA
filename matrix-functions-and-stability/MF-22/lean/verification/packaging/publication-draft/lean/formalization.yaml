automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple implementing agents and two independent nonimplementing mathematical referees.
      Authoring occurs on macOS; actual Lean and Comparator gates run on non-root Linux. No local
      Lean/Lake/cache execution is used.
    prompting_notes: Full numerical statements, two independent statement approvals, actual Linux
      elaboration and an immutable freeze preceded proofs. Preserve every positive parameter including
      rho squared equals 10, the exact eight coefficient blocks and boundaries, singular condition
      numbers and actual eventual inverses. Use exact fixed-size algebra, cancellation before norm
      estimates and the permitted exponent 2. Select LeanCert kernel trust and independent Comparator
      with no definition holes.
  notes: Complete AI-assisted candidate source was prepared by /root/next_matrix_functions with
    separately assigned root/projector algebra contributions from /root/next_elimination. Independent
    final mathematical source referees are /root and /root/next_inequalities. Prior failed development
    runs remain failed; source approval and successful prefixes do not constitute complete Lean
    verification.
