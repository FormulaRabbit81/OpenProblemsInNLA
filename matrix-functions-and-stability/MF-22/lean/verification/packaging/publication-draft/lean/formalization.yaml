  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: MF-22 — Polynomial conditioning of the cubic C1 spline Schrodinger Toeplitz family
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8f04b905eb2e0827b6b84f37d9d080ae1f05b202/matrix-functions-and-stability/MF-22/README.md
  type: web-post
  location: Complete original problem, exact coefficient blocks and retained resolution
  relationship: formalizes
  author_endorsement: not-contacted
  note: Permanent ID, original parameter domain, original Toeplitz boundary and complete existential
    polynomial target preserved.
- title: 'MF-22: An eventual linear condition-number bound'
  authors:
  - George Stepaniants
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/8f04b905eb2e0827b6b84f37d9d080ae1f05b202/matrix-functions-and-stability/MF-22/solution.md
  type: manuscript
  location: Theorem in Section 1 and complete proof in Sections 2–4
  relationship: adapts
  author_endorsement: not-contacted
  note: The retained manuscript proves a linear bound. This implementation follows its transfer,
    root, noncancellation and finite Green mechanisms but uses a quadratic estimate, which proves
    the full original existential polynomial target. It makes no claim to formalize the manuscript’s
    exponent-one bound.
- title: Condition numbers of block Toeplitz matrices and stability of space-time IgA approximations
    for the wave and Schrodinger equations
  authors:
  - M. Bogoya
  - A. Bottcher
  - M. Ferrari
  - S. M. Grudsky
  - S. Serra-Capizzano
  id: https://arxiv.org/abs/2608.24151v1
  type: preprint
  location: Equation (5.22), Section 5.3, equation (5.32), Proposition 5.14 and paragraph after
    Figure 9
  relationship: background
  author_endorsement: not-contacted
  note: The original family, source root classification and question retain their original authors'
    credit; no unproved source result is an intended axiom.
