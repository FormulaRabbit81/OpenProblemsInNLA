version: v0.4
project:
  name: 'SF-01: preservation of real H-matrices by Newton square-root iteration'
  description: Statement-only draft for every exact Newton iterate from A, for every
    real positive-diagonal nonsingular H-matrix in every positive finite dimension.
    The original complex-spectral comparison definition and genuine inverse
    obligations are retained.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California
      Institute of Technology, Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: SF-01 — Preservation of real H-matrix structure by Newton square-root iterates
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/ce47b5630bf3680d9211131c3a43825b022c139a/matrix-functions-and-stability/SF-01/README.md
  type: web-post
  location: Complete original problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: Permanent ID, spectral comparison predicate, positive real diagonal,
    original initialization, exact recurrence and all dimensions and iterations preserved.
- title: Preservation of positive-diagonal H-matrices by scaled Newton and Halley square-root iterations
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/ce47b5630bf3680d9211131c3a43825b022c139a/references/colbrook-matrix-functions-2026-09-11/manuscripts/SF-01.tex
  type: manuscript
  location: Theorem 1, specialized only to the complete original A-initialized Newton target
  relationship: formalizes
  author_endorsement: not-contacted
  note: Original mathematical authorship remains Matthew J. Colbrook, Department of
