automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple independent problem and referee agents. Private statement drafting
      and static source audits on macOS; later actual elaboration, build, default-kernel
      replay and Comparator are performed by the coordinator on Linux. No local Lean/Lake.
    prompting_notes: Write the complete statement and numerical obligations before proofs.
      Preserve the original spectral H predicate and all n and k. Optimize via an exact
      finite rational invariant, positive rank-one pole matrix and generic block Woodbury
      identities, not interval subdivision or finite input sampling. Require two independent
      statement approvals and actual elaboration before freezing and implementation.
  notes: AI-assisted statement-only draft by /root/ie13_continuation. Root reviewed the
    feasibility route, but this exact Lean draft has no independent statement approvals,
    elaboration, proof implementation, official Tau Ceti endorsement or human peer review.
status:
  scope: Definitions and 24 independent unproved Challenge signatures only. No frozen
    statement boundary, successful elaboration, proof verification or verified-count increment.
  main_results: []
fidelity:
  divergences: The full original Newton target is retained. The source's broader initialization
    and Halley extensions are outside scope. A finite positive-definite rank-one spectral
    construction and exact matrix Woodbury identity replace general scalar partial-fraction
    reasoning. Spectral M-to-weight and weight-to-spectral M bridges are explicit obligations,
    not assumed replacements of the original H predicate. Actual inverse availability is
    included in the final conclusion. No final hypothesis is added.
review:
  status: unreviewed statement-only draft; source and runtime gates pending
  reviewers: []
  notes: Apply the pinned Tau Ceti correctness, generality, proof quality, attribution and
    reuse rubrics within scope using two independent statement and final proof referees.
    No official Tau Ceti review is claimed. Actual Linux Comparator, default-kernel replay,
    rejection controls and exact published-commit authentication remain required.
alignment:
  source_correspondence: SourceCorrespondence.md
  numerical_boundary: NUMERICAL_TARGETS.md
  proposed_statements: Challenge.lean
  source_provenance: SOURCE-PROVENANCE.json
  intended_implementation_entry: Solution.lean
acknowledgements: Matthew J. Colbrook for the original mathematics; Sidney Holden for the
  existing IV-03 formalization to be reused with attribution; Mathlib, LeanCert, Comparator,
  Schiffer and Forsythe contributors for the inspected foundations and workflow patterns.
