# yaml-language-server: $schema=../../../docs/lean/schema/v0.4.schema.json
version: v0.4
project:
  name: 'SF-01: preservation of real H-matrices by Newton square-root iteration'
  description: Full original positive-diagonal real H-matrix Newton theorem, for every positive dimension,
    every admissible matrix and every iteration. The original complex algebraic spectral-radius predicate
    and actual inverse availability are retained.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: SF-01 — Preservation of real H-matrix structure by Newton square-root iterates
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/ce47b5630bf3680d9211131c3a43825b022c139a/matrix-functions-and-stability/SF-01/README.md
  type: web-post
  location: Complete original problem statement
  relationship: formalizes
  author_endorsement: not-contacted
  note: Permanent ID, spectral comparison predicate, positive real diagonal, original initialization,
    exact recurrence and all dimensions and iterations preserved.
- title: Preservation of positive-diagonal H-matrices by scaled Newton and Halley square-root iterations
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/ce47b5630bf3680d9211131c3a43825b022c139a/references/colbrook-matrix-functions-2026-09-11/manuscripts/SF-01.tex
  type: manuscript
  location: Theorem 1, specialized only to the complete original A-initialized Newton target
  relationship: formalizes
  author_endorsement: not-contacted
  note: Original mathematical authorship remains Matthew J. Colbrook, Department of Applied Mathematics
    and Theoretical Physics, University of Cambridge. Scaled or affine initializations and Halley extensions
    are not proposed formal claims.
- title: Partial Fraction Expansions for Newton's and Halley's Iterations for Square Roots
  authors:
  - Omran Kouba
  id: https://arxiv.org/abs/1104.4175v2
  type: preprint
  location: Lemma 2.1 and Theorem 2.4
  relationship: background
  author_endorsement: not-contacted
  note: Inspected alternate explicit scalar partial-fraction route. Its conclusions are not imported as
    assumptions; the proposed route uses finite spectral Woodbury algebra.
related_formalizations:
- id: https://github.com/sidneyholden1/OpenProblemsInNLA/tree/281f440650d174602120ca9b2b930d38f9fef205/intervals-and-absolute-value-equations/IV-03/lean
  relationship: builds-on
  note: Two unchanged Apache-2.0 IV03 files by Sidney Holden are genuinely imported. Weighted maximum-principle,
    unitness and inverse-positivity lemmas are consumed; their original credit and license remain. The
    new SF01 spectral equivalence is proved separately.
- id: https://github.com/leanprover-community/mathlib4/tree/0df444a360eaa60ab8c11dca51a86af692955474
  relationship: builds-on
  note: Pinned actual finite complex spectra, Hermitian spectral theorem, positive definite eigenvalues,
    Woodbury, Kronecker algebra and inverse continuity.
- id: https://github.com/sgstepaniants/Forsythe/tree/8d1b0c0545a77b40245e84705aa7d273e6c81e62/lean-proof
  relationship: other
  note: Challenge separation, complete numerical targets and Comparator configuration patterns read; no
    Forsythe mathematical theorem imported.
- id: https://github.com/jaumededios/Schiffer
  relationship: other
  note: Exact retained campaign Challenge snapshot reread for independent statement organization. Its
    byte hash is recorded; no fresh head or mathematical proof import claimed.
- id: https://github.com/alerad/leancert/tree/621a43d7cf21f87872392a01e874f2f1dbddc926
  relationship: builds-on
  note: Kernel-mode exact positivity certificate for one half, consumed by the first iterate and coefficient
    halving. No variable interval subdivision or input enumeration.
automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Parallel source and referee agents; one coordinator-run serial macOS compiler. Fresh non-root
      Linux default-kernel, Comparator and rejection-control execution is a separate gate.
    prompting_notes: Write the complete statement and numerical obligations before proofs. Preserve the
      original spectral H predicate and all n and k. Optimize via an exact finite rational invariant,
      positive rank-one pole matrix and generic block Woodbury identities, not interval subdivision or
      finite input sampling. Require two independent statement approvals and actual elaboration before
      freezing and implementation.
  notes: Substantial OpenAI Codex assistance. Private source and metadata preparation is distinct from
    actual runtime verification. The package preparer did not implement SF01 mathematics; proof authors
    and independent reviewers retain their explicit roles. No official Tau Ceti endorsement or human peer
    review is claimed.
status:
  scope: Every real positive-dimensional matrix satisfying the original spectral H predicate and strict
    positive diagonal, initialized by X0=A, with X(k+1)=(Xk+Xk^-1*A)/2 for every k>=0. Proves H structure,
    positive diagonal and actual unitness at every iterate.
