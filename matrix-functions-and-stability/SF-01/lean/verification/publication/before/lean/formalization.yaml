fidelity:
  divergences: The full original Newton target is retained. The source's broader initialization and Halley
    extensions are outside scope. A finite positive-definite rank-one spectral construction and exact
    matrix Woodbury identity replace general scalar partial-fraction reasoning. Spectral M-to-weight and
    weight-to-spectral M bridges are explicit obligations, not assumed replacements of the original H
    predicate. Actual inverse availability is included in the final conclusion. No final hypothesis is
    added.
