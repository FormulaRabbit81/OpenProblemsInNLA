automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple problem agents. Independent source and numerical-statement reviews before proof
      implementation. Source edits on macOS; Lean development checks on non-root Linux managed by the
      coordinator. No local Lean or Lake builds.
    prompting_notes: Preserve the complete free-linear-combination and shared-product-register model.
      Optimize away all interval subdivisions using exact factorization, and reuse Mathlib's Chebyshev
      theorem with an exact Joukowski recurrence. Use actual maxima, actual coefficient infima and a finite
      attained stage minimum. LeanCert kernel trust is selected explicitly for all exports.
  notes: AI-assisted implementation by /root/next_matrix_functions. Statement referees /root/next_elimination
    and /root approved the frozen boundary before bodies. The author is not an independent final referee.
    No external human peer review, official Tau Ceti endorsement, source-author endorsement beyond participation,
    or novelty claim is asserted. Final proof referees and mechanical evidence must be recorded after
    the actual final candidate passes.
