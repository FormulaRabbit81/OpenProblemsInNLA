fidelity:
  divergences: No target restriction. The formal proof reverses the affine interval map so that only the
    positive exterior Chebyshev comparison is needed. It uses an arbitrary strict positive tolerance to
    include zero actual error without a separate polynomial identity theorem. Derivative and hyperbolic-function
    arguments are replaced by exact polynomial factors and recurrence identities. The coefficient infima
    are never assumed attained. Neither exact optimal stage counts beyond m=0,1 nor an optimal leading
    constant is claimed.
