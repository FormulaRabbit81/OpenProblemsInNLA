fidelity:
  divergences: The pointwise vertex is proved equal to its matrix formula. All dimensions, weak entrywise
    inequalities, reducible cases and zero interval widths are retained. Proper principal minors and adjugate
    signs imply determinant positivity without regularity. Exact resolvent algebra replaces the derivative
    argument, and a row-replacement determinant establishes the cofactor identity without inverting A.
