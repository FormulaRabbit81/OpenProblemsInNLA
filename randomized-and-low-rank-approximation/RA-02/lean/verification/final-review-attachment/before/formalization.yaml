fidelity:
  divergences: The proof uses an explicit real-entry positive-definite arrowhead family of order r+1 with
    factor 2^r/3, sufficient to negate the full universal complex-PSD assertion. It does not formalize
    the manuscript sharp limiting ratio 2^r or entrywise-positive/LU/correlation extensions. Full finite
    path weights replace optional measure-theoretic packaging, with mandatory normalization/PSD/conditional-law
    proofs. A uniform dummy label at a zero residual preserves exact zero absorption. The tail uses actual
    ordered eigenvalues₀ with only cardinality-index transport.
