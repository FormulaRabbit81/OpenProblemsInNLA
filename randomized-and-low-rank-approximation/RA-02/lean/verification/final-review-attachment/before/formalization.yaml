# yaml-language-server: $schema=../../../docs/lean/schema/v0.4.schema.json
version: v0.4
project:
  name: 'RA-02: no polynomial trace-error factor after exactly the target rank of pivots'
  description: Complete negative answer to the original RPCholesky polynomial trace-factor question. For
    every real C>0 and p>=0, a complex positive-definite matrix of order r+1 strictly violates the proposed
    bound after exactly r pivots. All normalized process and genuine ordered eigenvalue-tail semantics
    are proved.
  authors:
  - George Stepaniants
  affiliations:
    George Stepaniants: Department of Computing and Mathematical Sciences, California Institute of Technology,
      Pasadena, California, USA
  responsible_maintainers:
  - George Stepaniants
  license: Apache-2.0
sources:
- title: RA-02 — Polynomial trace-error factor after exactly the target rank of pivots
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/ce47b5630bf3680d9211131c3a43825b022c139a/randomized-and-low-rank-approximation/RA-02/README.md
  type: web-post
  relationship: formalizes
  location: Complete original problem, context and sampling convention
  author_endorsement: not-contacted
  note: Permanent ID, original canonical path, full mathematical target and original mathematical authorship
    are retained.
- title: Sharp worst-case factors for randomly pivoted Cholesky and LU
  authors:
  - Matthew J. Colbrook
  id: https://github.com/ajt60gaibb/OpenProblemsInNLA/blob/ce47b5630bf3680d9211131c3a43825b022c139a/references/colbrook-random-pivoting-2026-09-11/manuscripts/sharp_random_pivoting.tex
  type: manuscript
  relationship: formalizes
  location: Theorem 1 and Corollary 3, negative RA-02 target
  author_endorsement: not-contacted
  note: Original resolution credited to Matthew J. Colbrook, Department of Applied Mathematics and Theoretical
    Physics, University of Cambridge. This finite arrowhead proof establishes the sufficient factor 2^r/3,
    not the manuscript sharp limiting ratio, entrywise-positive, correlation-matrix or LU extensions.
