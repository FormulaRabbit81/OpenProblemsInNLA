    chain.
automation:
  methods:
  - method: agent
    framework: OpenAI Codex
    tool_setup: Parallel proof and independent-referee agents. Actual local development used one coordinator-run
      macOS compiler, one thread and at most4096MiB per process, with pinned source-matched reuse. Fresh
      final non-root Linux kernel/Comparator/sandbox execution is a separate gate.
    prompting_notes: Numerical and semantic statements written and hashed before Lean definitions/contracts.
      Preserve actual normalized PSD pivot law, full finite path expectation, true decreasing Hermitian
      eigenvalue tail and arbitrary real exponent. Minimize computation to one consumed kernel-mode LeanCert
      exp(1)<=3 certificate; all rank and path arguments symbolic.
  notes: Substantial OpenAI Codex assistance. The package preparer /root/mf22_publication_referee authored
    RA02 statements and most proof modules and is not an independent final referee. Other proof contributors
    are /root/mi04_independent_referee and /root; the two complete nonauthor final reviewers and exact
    scopes are retained separately. No official Tau Ceti endorsement or human peer review is claimed.
