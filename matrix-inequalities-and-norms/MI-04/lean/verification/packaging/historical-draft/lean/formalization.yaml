fidelity:
  divergences: The full original necessity implication is retained; the manuscript converse and four-way
    equivalence are not claimed. An exact all-vector Rayleigh-quotient sandwich replaces analytic eigenvalue-branch
    perturbation. Only diagonal probes with entries 1, 0 and 1/2 are needed. Pair symmetry is first extended
    to arbitrary orthogonal vectors by homogeneity, so the exact sparse vectors (1,1,1) and (1,I,-1-I)
    establish collinearity without explicit square-root normalization or cube roots of unity. The full
    joint-eigenspace construction proves normal diagonalization, retaining multiplicities. None of these
    changes adds a final hypothesis or changes the requested conclusion.
