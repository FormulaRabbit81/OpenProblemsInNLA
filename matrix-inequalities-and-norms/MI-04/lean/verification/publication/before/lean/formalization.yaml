  - method: agent
    framework: OpenAI Codex
    tool_setup: Multiple source and referee agents; one coordinator-run serial macOS Lean compiler for
      development with pinned shared caches. Fresh non-root Linux default-kernel/Comparator/control verification
      is a separate pending gate.
    prompting_notes: Write all numerical obligations and definitions before proofs; obtain two independent
      statement approvals and actual Linux elaboration; freeze the exact boundary. Keep all dimensions,
      singular and repeated cases and full universal A/B hypothesis. Use symbolic Rayleigh bounds, exact
      diagonal probes and a full joint-eigenspace spectral theorem. Consume LeanCert quarter-gap certification
      in kernel mode; require independent full final source/runtime reviews and canonical Comparator with
      no definition holes.
  notes: Substantial OpenAI Codex assistance. Initial complete implementation and independently reviewed
    later proof repairs are identified in reviews/INDEX.json. The present package preparer authored the
    latest generic diagonalization repair and is not its independent referee. Scoped source approvals
    and actual local compiler logs are retained; no human or official Tau Ceti endorsement is claimed.
status:
  scope: For every positive finite dimension and arbitrary complex square matrix X, if every genuine Hermitian
    positive-semidefinite block completion [A X; X* B] has complex Euclidean operator norm at most that
    of A+B, then X is an affine complex combination of an actual Hermitian matrix and the identity. This
    is the full original necessity implication, with the universal A/B premise, singular completions,
    zero/scalar matrices, repeated values, and dimensions one and two retained. No converse or genericity
    assumption is claimed.
